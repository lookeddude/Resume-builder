<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle top-left shine -->
  <rect width="32" height="32" rx="7" fill="url(#shine)"/>

  <!-- Document body (white, slightly inset) -->
  <rect x="7" y="6" width="14" height="18" rx="2" fill="white" opacity="0.95"/>

  <!-- Folded corner -->
  <polygon points="17,6 21,6 21,10" fill="#c4b5fd" opacity="0.8"/>
  <polygon points="17,6 21,10 17,10" fill="white" opacity="0.5"/>

  <!-- Resume text lines -->
  <rect x="9.5" y="12.5" width="9" height="1.5" rx="0.75" fill="#6366f1" opacity="0.85"/>
  <rect x="9.5" y="15.5" width="7" height="1.2" rx="0.6" fill="#a5b4fc" opacity="0.7"/>
  <rect x="9.5" y="18"   width="8" height="1.2" rx="0.6" fill="#a5b4fc" opacity="0.7"/>
  <rect x="9.5" y="20.5" width="5.5" height="1.2" rx="0.6" fill="#a5b4fc" opacity="0.5"/>

  <!-- Checkmark badge (bottom-right) -->
  <circle cx="23" cy="23" r="5" fill="#22c55e"/>
  <polyline points="20.5,23 22.2,24.8 25.5,21.5"
    fill="none" stroke="white" stroke-width="1.6"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
